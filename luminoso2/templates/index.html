<!doctype html>
<script type="text/javascript" src="http://ajax.googleapis.com/ajax/libs/jquery/1.5.2/jquery.min.js"></script>
<script type="text/javascript">
$(function() {
  var docs = $('#docs')
  docs.change(function() {
    var url = docs.val()
    $.getJSON('/docs?url='+url, function(data) {
      $('#contents').text(data.text);
    });
  });
  $.getJSON('/docs', function (data) {
   $.each(data.docs, function (idx,url) {
      $("<option>").text(url).appendTo(docs);
    });
  });
});
</script>
<select id="docs" size=10></select>
Contents:
<div id="contents"></div>
